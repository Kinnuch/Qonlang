# 打 tag（v0.3.0 这种）或手动触发时，同时在 Windows、macOS 与 Linux 上出安装包。
# 三个平台都成功以后才上传到同名 GitHub Release，避免重发时有的平台仍是上一批。
# 版本号带「-」的（v1.0.0-beta.1）标成预发布：正式版用户的检查更新只看 releases/latest，收不到测试版。
# Release 的说明从中英两份更新日志里摘（scripts/release-notes.mjs），每个 job 写的都一样。
name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '发布当前版本标签的安装包（默认只构建）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: windows
            # latest.yml 与 .blockmap 给应用内的增量更新用：少了就让这一步失败，免得悄悄只剩整包下载
            files: |
              dist/*-setup.exe
              dist/*-setup.exe.blockmap
              dist/latest.yml
          - os: macos-latest
            script: build:mac
            artifact: macos
            files: |
              dist/*-mac-x64.dmg
              dist/*-mac-arm64.dmg
              dist/*-mac-x64.zip
              dist/*-mac-arm64.zip
          - os: ubuntu-latest
            script: build:linux
            artifact: linux
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    env:
      # 没有签名证书：跳过 macOS 签名与公证
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - name: List outputs
        shell: bash
        run: ls -la dist | grep -v '^d'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Qonlang ${{ github.ref_name }}
          files: |
            dist/*-setup.exe
            dist/*-setup.exe.blockmap
            dist/latest.yml
            dist/*-mac-x64.dmg
            dist/*-mac-arm64.dmg
            dist/*-mac-x64.zip
            dist/*-mac-arm64.zip
            dist/*.AppImage
            dist/*.deb
          fail_on_unmatched_files: true
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
