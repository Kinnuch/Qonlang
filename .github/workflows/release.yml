# 打 tag（v0.3.0 这种）或手动触发时，同时在 Windows 与 macOS 上出安装包。
# 打 tag 时每个平台的 job 直接把自己的产物挂到同名 GitHub Release（两个 job 各自追加，不经过 artifact 中转）。
name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: windows
            files: |
              dist/*-setup.exe
          - os: macos-latest
            script: build:mac
            artifact: macos
            files: |
              dist/*-mac-x64.dmg
              dist/*-mac-arm64.dmg
              dist/*-mac-x64.zip
              dist/*-mac-arm64.zip
    runs-on: ${{ matrix.os }}
    env:
      # 没有签名证书：跳过 macOS 签名与公证
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - name: List outputs
        shell: bash
        run: ls -la dist | grep -v '^d'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Qonlang ${{ github.ref_name }}
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
          generate_release_notes: true
